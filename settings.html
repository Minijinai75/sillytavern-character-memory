<div class="charMemory_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>CharMemory</b>
            <span id="charMemory_openWizard" class="charMemory_headerGear" title="設定精靈">
                <i class="fa-solid fa-wand-magic-sparkles fa-sm"></i>
            </span>
            <span id="charMemory_openTroubleshooter" class="charMemory_headerGear" title="疑難排解">
                <i class="fa-solid fa-screwdriver-wrench fa-sm"></i>
            </span>
            <span id="charMemory_openSettingsModal" class="charMemory_headerGear" title="開啟設定">
                <i class="fa-solid fa-gear fa-sm"></i>
            </span>
            <span id="charMemory_toggleInjectionBtn" class="charMemory_headerGear" title="切換注入檢視器">
                <i class="fa-solid fa-syringe fa-sm"></i>
            </span>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <!-- Nudge banner -->
            <div id="charMemory_nudgeBanner" class="charMemory_nudgeBanner" style="display:none;">
                <i class="fa-solid fa-triangle-exclamation fa-sm"></i>
                <span>需要注意</span>
                <input type="button" id="charMemory_nudgeFix" class="menu_button" value="檢視" />
            </div>

            <!-- Stats bar -->
            <div class="charMemory_statsBar">
                <div class="charMemory_statItem" title="儲存此角色記憶的資料庫檔案">
                    <i class="fa-solid fa-file-lines fa-sm"></i>
                    <span id="charMemory_statFile">沒有角色</span>
                </div>
                <div class="charMemory_statItem" title="儲存的個別記憶項目總數">
                    <i class="fa-solid fa-brain fa-sm"></i>
                    <span id="charMemory_statCount">0 個記憶</span>
                </div>
                <div class="charMemory_statItem" title="自上次提取以來的新訊息數 / 自動提取閾值">
                    <i class="fa-solid fa-arrows-rotate fa-sm"></i>
                    <span id="charMemory_statProgress">0/10 則訊息</span>
                </div>
                <div class="charMemory_statItem" title="下次自動提取允許前的剩餘時間">
                    <i class="fa-solid fa-clock fa-sm"></i>
                    <span id="charMemory_statCooldown">就緒</span>
                </div>
                <div class="charMemory_statItem charMemory_statHealth" id="charMemory_statHealth"
                     title="注入健康狀態 — 點擊查看詳情">
                    <span class="charMemory_healthDot" id="charMemory_healthDot"></span>
                    <span id="charMemory_healthLabel">&mdash;</span>
                </div>
            </div>

            <!-- Primary Controls -->
            <div class="charMemory_dashSection">
                <div class="charMemory_buttonRow">
                    <input type="button" id="charMemory_extractNow" class="menu_button" value="立即提取" title="從未處理的訊息中提取記憶。如果所有訊息都已處理，請先使用「重設提取狀態」從頭重新讀取。" />
                    <button id="charMemory_autoExtractPill" class="charMemory_autoPill" title="切換自動提取 — 開啟時，在設定數量的新訊息後自動提取記憶">
                        <i class="fa-solid fa-arrows-rotate fa-xs"></i> 自動
                    </button>
                    <input type="button" id="charMemory_manageMemories" class="menu_button" value="檢視 / 編輯" title="瀏覽、編輯和刪除個別儲存的記憶" />
                </div>
            </div>

            <!-- Tool Launchers -->
            <div class="charMemory_dashSection">
                <small class="charMemory_sectionLabel">資料庫工具</small>
                <div class="charMemory_buttonRow">
                    <input type="button" id="charMemory_filesPopover" class="menu_button" value="資料庫" title="瀏覽和管理此角色的資料庫檔案" />
                    <input type="button" id="charMemory_consolidateBtn" class="menu_button" value="整合" title="使用 LLM 合併重複和相關的記憶" />
                    <input type="button" id="charMemory_batchBtn" class="menu_button" value="批次處理" title="一次對多個聊天執行提取" />
                    <input type="button" id="charMemory_formatBtn" class="menu_button" value="重新格式化" title="重新格式化記憶檔案結構以獲得更好的檢索效果" />
                </div>
            </div>

            <!-- Activity (mini log) -->
            <div class="charMemory_dashSection">
                <small class="charMemory_sectionLabel">活動</small>
                <div id="charMemory_dashActivity" class="charMemory_dashActivity">
                    <div class="charMemory_diagEmpty charMemory_miniLogEmpty">尚無活動。</div>
                </div>
                <a id="charMemory_viewFullLog" class="charMemory_link">查看完整日誌 &rarr;</a>
            </div>

            <!-- Diagnostics summary -->
            <div class="charMemory_dashSection">
                <div class="charMemory_dashDiagHeader">
                    <small class="charMemory_sectionLabel">診斷</small>
                </div>
                <div id="charMemory_dashDiagSummary">
                    <div class="charMemory_diagEmpty">尚無診斷資訊。</div>
                </div>
                <a id="charMemory_viewDiagDetails" class="charMemory_link">查看詳情 &rarr;</a>
            </div>

        </div>
    </div>
</div>
